# GTM Engine Configuration
# Generated by /setup — edit manually or re-run /setup to regenerate
# This file is .gitignored — your config stays local

# =============================================================================
# COMPANY
# =============================================================================
company:
  name: "Acme Inc"                    # Your company name
  product: "Acme Platform"            # Product name
  website: "https://acme.com"         # Company website
  one_liner: "We help B2B teams do X faster"  # One-sentence pitch
  stage: "pre-revenue"               # pre-revenue | early-revenue | scaling

# =============================================================================
# TEAM
# =============================================================================
# Add everyone who needs tasks assigned in Linear.
# Get Linear user IDs: run `list_users` via Linear MCP, or find in Linear settings.
team:
  - name: "Alex"
    role: "founder"                   # founder | sdr | cs | engineer | other
    linear_user_id: "your-uuid-here"
    is_default_assignee: true         # Only one person should be default

  # - name: "Jordan"
  #   role: "sdr"
  #   linear_user_id: "uuid-here"
  #   is_default_assignee: false

  # - name: "Sam"
  #   role: "cs"
  #   linear_user_id: "uuid-here"
  #   is_default_assignee: false

  # - name: "Pat"
  #   role: "engineer"
  #   linear_user_id: "uuid-here"
  #   is_default_assignee: false

# =============================================================================
# LINEAR
# =============================================================================
linear:
  # Two-team system: one for pipeline tracking, one for action tasks
  pipeline_team: "Sales"              # Team name for lead/deal tracking
  action_team: "GTM"                  # Team name for tasks, follow-ups, outreach
  default_label: "gtm-engine"         # Label applied to all engine-created tasks

  # Pipeline stages (customize to match your Linear workflow)
  pipeline_stages:
    - "Backlog"
    - "Todo"
    - "Connection Started"
    - "Discovery"
    - "Qualified"
    - "Demo Scheduled"
    - "POC"
    - "Agreement"
    - "Closed Won"
    - "Closed Lost"

  # Canceled status spelling (Linear varies)
  canceled_spelling: "Canceled"       # "Canceled" (US) or "Cancelled" (UK)

# =============================================================================
# INTEGRATIONS
# =============================================================================
integrations:
  # Google Workspace (Gmail, Calendar, Sheets, Docs)
  google_workspace:
    enabled: false                    # Set to true after installing Google Workspace MCP
    # No API keys needed — MCP handles auth

  # Fathom call recording
  fathom:
    enabled: false                    # Set to true if you use Fathom
    api_key_env: "FATHOM_API_KEY"     # Name of env var in .env file

  # Lead tracking spreadsheet
  outreach_sheet:
    enabled: false                    # Set to true if using a Google Sheet for leads
    spreadsheet_id: ""                # Google Sheets ID
    # Column mapping (adjust to your sheet layout)
    columns:
      company: "A"
      website: "B"
      signal: "C"
      contact: "D"
      status: "E"
      notes: "F"
      verdict: "G"                    # Yes/Nope (filled by /validate-lead)
      action: "H"                     # Go ahead/No go
      score: "I"
      date: "J"
      comment: "K"                    # One-line reasoning

# =============================================================================
# ICP (Ideal Customer Profile)
# =============================================================================
# Filled in during /setup ICP workshop, or manually
icp:
  # Scoring criteria (each scored 0 or 1, summed for total)
  scoring_criteria:
    - name: "Geography"
      description: "Company in target geography"
      weight: 1
    - name: "Company Size"
      description: "10-500 employees (sweet spot for your product)"
      weight: 1
    - name: "Industry"
      description: "In target industry/vertical"
      weight: 1
    - name: "Has Problem"
      description: "Evidence they have the problem you solve"
      weight: 1
    - name: "Tech Fit"
      description: "Their tech stack is compatible with your product"
      weight: 1
    - name: "Buying Signal"
      description: "Active signal: hiring, searching, evaluating tools"
      weight: 1

  # Auto-reject rules (any match = skip)
  no_go_rules:
    - "Enterprise 5000+ employees (too long a sales cycle)"
    - "Service/consulting company (no product to test)"
    # Add your own no-go rules

  # Tier thresholds (based on total score out of max)
  tiers:
    core: 5          # Score >= this = Core ICP
    broader: 3       # Score >= this = Broader ICP
    # Below broader threshold = Not ICP

# =============================================================================
# CONTENT (for /linkedin-post, /cold-email voice consistency)
# =============================================================================
content:
  creator_name: ""                    # Your first name (for "I" voice)
  platforms:
    - "linkedin"                      # linkedin | twitter | blog
  audience: "B2B founders and operators"
  voice_notes: |
    Conversational, not corporate.
    First person "I" always.
    Admits uncertainty — "I'm still figuring this out."
    No jargon, no buzzwords.

# =============================================================================
# RITUAL (Daily 3+2 System)
# =============================================================================
ritual:
  meaningful_count: 3                 # Number of meaningful tasks per day
  light_count: 2                      # Number of light tasks per day
  meaningful_definition: |
    Gets closer to revenue: outreach, calls, pipeline follow-up,
    experiments, content, new channels
  light_definition: |
    Routine/operational: messages, CRM updates, scheduling,
    reviews, admin tasks
  labels:
    meaningful: "daily-3"             # Linear label for meaningful tasks
    light: "daily-2"                  # Linear label for light tasks
    parking_lot: "parking-lot"        # Linear label for parked ideas

  # Cohort/accountability group (optional)
  cohort:
    enabled: false
    name: ""                          # e.g., "YC batch", "Sales cohort"
    call_day: ""                      # e.g., "Thursday"
    homework_due: ""                  # e.g., "Tuesday"

# =============================================================================
# VERSION TRACKING (managed by /whats-new)
# =============================================================================
last_seen_version: "1.0.0"
